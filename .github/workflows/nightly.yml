name: Nightly release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15'
      - name: Select release version and commit
        id: release
        run: |
          version=$(python .github/scripts/release.py)
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install test and build dependencies
        if: steps.release.outputs.version != ''
        run: python -m pip install '.[test]'
      - name: Test
        if: steps.release.outputs.version != ''
        run: python -m pytest
      - name: Build release distributions
        if: steps.release.outputs.version != ''
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_SHGIT: ${{ steps.release.outputs.version }}
        run: python -m build
      - name: Verify distribution versions
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          from email import message_from_bytes
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          expected = os.environ['RELEASE_VERSION']
          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == len(sdists) == 1, 'expected one wheel and one sdist'
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = next(name for name in wheel.namelist() if name.endswith('.dist-info/METADATA'))
              assert message_from_bytes(wheel.read(metadata))['Version'] == expected
          with tarfile.open(sdists[0]) as sdist:
              metadata = next(member for member in sdist.getmembers() if member.name.endswith('/PKG-INFO'))
              assert message_from_bytes(sdist.extractfile(metadata).read())['Version'] == expected
          PY
      - name: Publish GitHub prerelease
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/*.whl dist/*.tar.gz \
            --target "$RELEASE_SHA" --prerelease --latest=false \
            --title "Nightly $RELEASE_VERSION" --notes "Nightly build of $RELEASE_SHA."
