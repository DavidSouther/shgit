[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "shgit"
authors = [
    {name = "David Souther", email = "davidsouther+github@gmail.com"},
]
description = "Fluent Shell & Git python library"
dynamic = ["version"]
readme = "README.md"
dependencies = ["structlog"]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest", "build", "setuptools", "setuptools-scm"]

[tool.setuptools]
packages = ["shgit"]
py-modules = ["walk"]

[tool.setuptools.package-data]
shgit = ["py.typed"]

[tool.setuptools_scm]
